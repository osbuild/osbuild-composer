---
image_types:
  qcow2:
    required_partition_sizes:
      /: 1 GiB
      /usr: 2 GiB
    bootable: true
    exports:
      - qcow2
    filename: disk.qcow2
    image_func: disk
    mime_type: application/x-qemu-disk
    name_aliases: []
    blueprint:
      supported_options:
        - distro
        - packages
        - modules
        - groups
        - enabled_modules
        - containers
        - customizations.cacerts
        - customizations.directories
        - customizations.disk
        - customizations.dnf
        - customizations.files
        - customizations.filesystem
        - customizations.firstboot
        - customizations.partitioning_mode
        - customizations.fips
        - customizations.firewall
        - customizations.user
        - customizations.sshkey
        - customizations.group
        - customizations.hostname
        - customizations.kernel
        - customizations.locale
        - customizations.openscap
        - customizations.repositories
        - customizations.rpm
        - customizations.services
        - customizations.timezone
        - customizations.rhsm
        - customizations.sshd

    default_size: 10 GiB
    image_config:
      default_kernel: kernel-automotive
      default_kernel_name: kernel-automotive
      enabled_services:
        - sshd
        - chronyd
      kernel_options:
        - rd.modules-load=nvme,virtio_mmio
    package_sets:
      os:
        - include:
            - '@core'
            - audit
            - automotive-image-builder
            - awscli
            - chrony
            - cloud-init
            - cloud-utils-growpart
            - fusa-gcc-plugin
            - fusa-gcc-plugin-data
            - git
            - iputils
            - less
            - network-manager-applet
            - nmstate
            - openssh-server
            - psmisc
            - qemu-guest-agent
            - redhat-release-automotive
            - redhat-release-automotive-eula
            - rsync
            - strace
            - subscription-manager
            - tar
            - tcpdump
            - tuned
            - vim
          exclude:
            - aic94xx-firmware
            - alsa-firmware
            - alsa-lib
            - alsa-tools-firmware
            - biosdevname
            - dnf-plugin-spacewalk
            - dracut-config-rescue
            - firewalld
            - iprutils
            - ivtv-firmware
            - iwl1000-firmware
            - iwl100-firmware
            - iwl105-firmware
            - iwl135-firmware
            - iwl2000-firmware
            - iwl2030-firmware
            - iwl3160-firmware
            - iwl3945-firmware
            - iwl4965-firmware
            - iwl5000-firmware
            - iwl5150-firmware
            - iwl6000-firmware
            - iwl6000g2a-firmware
            - iwl6000g2b-firmware
            - iwl6050-firmware
            - iwl7260-firmware
            - langpacks-*
            - langpacks-en
            - libertas-sd8787-firmware
            - plymouth
            - rng-tools
            - udisks2
    partition_table:
      aarch64:
        partitions:
          - payload:
              fstab_freq: 0
              fstab_options: defaults,uid=0,gid=0,umask=077,shortname=winnt
              fstab_passno: 2
              label: ESP
              mountpoint: /boot/efi
              type: vfat
            payload_type: filesystem
            size: 200 MiB
            type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
          - payload:
              fstab_freq: 0
              fstab_options: defaults
              fstab_passno: 0
              label: root
              mountpoint: /
              type: ext4
            payload_type: filesystem
            size: 2 GiB
            type: B921B045-1DF0-41C3-AF44-4C6F280D3FAE
        type: gpt
      x86_64:
        partitions:
          - payload:
              fstab_freq: 0
              fstab_options: defaults,uid=0,gid=0,umask=077,shortname=winnt
              fstab_passno: 2
              label: ESP
              mountpoint: /boot/efi
              type: vfat
            payload_type: filesystem
            size: 200 MiB
            type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
          - payload:
              fstab_freq: 0
              fstab_options: defaults
              fstab_passno: 0
              label: root
              mountpoint: /
              type: ext4
            payload_type: filesystem
            size: 2 GiB
            type: 4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709
        type: gpt
    platforms:
      - arch: x86_64
        bootloader: grub2
        image_format: qcow2
        packages:
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2
            - grub2-efi-x64
            - shim-x64
        qcow2_compat: '1.1'
        uefi_vendor: '{{.DistroVendor}}'
      - arch: aarch64
        bootloader: grub2
        image_format: qcow2
        packages:
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2
            - grub2-efi-aa64
            - grub2-tools
            - shim-aa64
        qcow2_compat: '1.1'
        uefi_vendor: '{{.DistroVendor}}'
