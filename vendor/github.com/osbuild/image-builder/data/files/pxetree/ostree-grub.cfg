set timeout=60
menuentry 'http-rootfs' {
    linux /vmlinuz root=live:http://HTTP-SERVER/rootfs.img rd.live.image @CMDLINE@ ostree=@OSTREE@ fstab=no
    initrd /initrd.img
}
menuentry 'combined-rootfs' {
    linux /vmlinuz root=live:/rootfs.img rd.live.image @CMDLINE@ ostree=@OSTREE@ fstab=no
    initrd /combined.img
}
